          description: 已参团人数
          example: 156
        stock:
          type: integer
          example: 500
        sales:
          type: integer
          example: 1200
        effectiveTime:
          type: integer
          description: 拼团有效期(小时)
          example: 24
        startTime:
          type: string
          format: date-time
          example: "2025-06-01T00:00:00"
        stopTime:
          type: string
          format: date-time
          example: "2025-07-31T23:59:59"
        status:
          type: integer
