    # ===== 文章实体 (eb_article) =====
    Article:
      type: object
      properties:
        id:
          type: integer
          example: 101
        cid:
          type: integer
          description: 分类ID
          example: 1
        title:
          type: string
          description: 文章标题
          example: "新用户注册指南"
        author:
          type: string
          example: "CRMEB官方"
        imageInput:
          type: string
          description: 封面图
          example: "https://img.crmeb.com/article/cover_101.jpg"
        synopsis:
          type: string
          description: 摘要
          example: "本文详细介绍新用户注册流程及注意事项"
