          type: string
          description: 文章内容(HTML)
          example: "<p>欢迎使用CRMEB商城...</p>"
        visit:
          type: integer
          description: 浏览量
          example: 5680
        createTime:
          type: string
          format: date-time
          example: "2025-05-01T10:00:00"

    # ===== 门店实体 =====
    StoreLocation:
      type: object
      properties:
        id:
          type: integer
          example: 1001
        name:
          type: string
          description: 门店名称
          example: "CRMEB深圳南山旗舰店"
        phone:
          type: string
          example: "0755-88886666"
        address:
          type: string
          description: 详细地址
          example: "广东省深圳市南山区科技园路100号"
        lat:
          type: number
          format: double
          description: 纬度
          example: 22.5431
        lng:
          type: number
          format: double
          description: 经度
          example: 113.9497
        image:
          type: string
          example: "https://img.crmeb.com/store/store_1001.jpg"
        businessTime:
          type: string
          description: 营业时间
          example: "09:00-21:00"
        distance:
          type: number
          format: double
          description: 距离(km)
          example: 1.5

    # ===== 城市实体 =====
    CityItem:
      type: object
      properties:
        id:
          type: integer
          example: 440300
        name:
          type: string
          description: 城市名称
          example: "深圳市"
        parentId:
          type: integer
          description: 父级ID
          example: 440000
        level:
          type: integer
          description: 层级 1省/2市/3区
          example: 2

    # ===== 支付实体 =====
    PaymentRequest:
      type: object
      required:
        - orderNo
        - payType
        - from
      properties:
        orderNo:
          type: string
          description: 订单号
          example: "20250620100000088001"
        payType:
          type: string
          enum: [weixin, alipay, yue]
          example: "weixin"
        from:
          type: string
          example: "wechat"

    PaymentQueryRequest:
      type: object
      required:
        - orderNo
      properties:
        orderNo:
          type: string
          description: 订单号
          example: "20250620100000088001"

    PaymentResult:
      type: object
      properties:
        paid:
          type: boolean
          description: 是否已支付
          example: true
        payType:
          type: string
          example: "weixin"
        payTime:
          type: string
          format: date-time
          example: "2025-06-20T10:05:30"
        payPrice:
          type: number
          format: decimal
          example: 238.00

    # ===== 评论实体 =====
    ProductReply:
      type: object
      properties:
        id:
          type: integer
          example: 6001
        uid:
          type: integer
          example: 10001
        nickname:
          type: string
          example: "张三"
        avatar:
          type: string
          example: "https://img.crmeb.com/avatar/user_10001.jpg"
        productId:
          type: integer
          example: 5001
        productScore:
          type: integer
          description: 商品评分 1-5
          example: 5
        serviceScore:
          type: integer
          description: 服务评分 1-5
          example: 5
        comment:
          type: string
          description: 评价内容
          example: "质量非常好，穿着很舒服，值得购买！"
        pics:
          type: array
          items:
            type: string
          example:
            - "https://img.crmeb.com/comment/img_88001_1.jpg"
        merchantReply:
          type: string
          description: 商家回复
          example: "感谢您的支持，我们会继续努力！"
        createTime:
          type: string
          format: date-time
          example: "2025-06-22T15:30:00"

    # ===== 首页数据 =====
    IndexData:
      type: object
      properties:
        banner:
          type: array
          description: 轮播图
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              pic:
                type: string
                example: "https://img.crmeb.com/banner/banner_01.jpg"
              url:
                type: string
                example: "/pages/goods_details/index?id=5001"
        menus:
          type: array
          description: 导航菜单
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              name:
                type: string
                example: "限时秒杀"
              pic:
                type: string
                example: "https://img.crmeb.com/menu/seckill.png"
        roll:
          type: array
          description: 滚动消息
          items:
            type: object
          example:
            - info: "张三 刚刚下单了2025新款潮流T恤"
        hotProduct:
          type: array
          items:
            $ref: '#/components/schemas/StoreProductSimple'
        newProduct:
          type: array
          items:
            $ref: '#/components/schemas/StoreProductSimple'
        goodProduct:
          type: array
          items:
            $ref: '#/components/schemas/StoreProductSimple'

    # ===== 搜索关键词 =====
    SearchKeyword:
      type: object
      properties:
        keywords:
          type: array
          description: 热门搜索关键词
          items:
            type: string
          example:
            - "T恤"
            - "防晒衣"
            - "耳机"
            - "电动牙刷"
            - "坚果"

    # ===== 分享配置 =====
    ShareConfig:
      type: object
      properties:
        title:
          type: string
          example: "CRMEB商城 - 品质生活，从这里开始"
        image:
          type: string
          example: "https://img.crmeb.com/share/default.png"
        desc:
          type: string
          example: "海量好物，超值优惠，尽在CRMEB商城"

    # ===== 登录相关 =====
    FrontMobileLoginRequest:
      type: object
      required:
        - phone
        - captcha
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
          description: 手机号
          example: "13800138000"
        captcha:
          type: string
          minLength: 4
          maxLength: 6
          description: 短信验证码
          example: "1234"
        spread:
          type: integer
          description: 推广人ID(可选)
          example: 0

    FrontPasswordLoginRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string
          description: 账号(手机号)
          example: "13800138000"
        password:
          type: string
          description: 密码
          example: "Pass@123456"

    FrontLoginResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "登录成功"
        data:
          type: object
          properties:
            token:
              type: string
              description: 前端认证token（UUID格式）
              example: "{{FRONT_TOKEN}}"
            user:
              $ref: '#/components/schemas/User'

    TokenExistResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "token有效"
        data:
          type: object
          properties:
            valid:
              type: boolean
              example: true

    LoginConfigResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "success"
        data:
          type: object
          properties:
            phoneLogin:
              type: boolean
              description: 是否开启手机号登录
              example: true
            wechatLogin:
              type: boolean
              description: 是否开启微信登录
              example: true
            register:
              type: boolean
              description: 是否开启注册
              example: true

    # ===== 用户编辑 =====
    UserEditRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 32
          description: 昵称
          example: "张三丰"
        avatar:
          type: string
          description: 头像URL
          example: "https://img.crmeb.com/avatar/user_10001_new.jpg"
        sex:
          type: integer
          description: 性别 0未知/1男/2女
          example: 1

    # ===== 错误响应 =====
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          description: 错误码
        message:
          type: string
          description: 错误消息
        data:
          nullable: true
  # ===== End of schemas =====

  # ===== 通用参数定义 =====
  parameters:
    PageParam:
      name: page
      in: query
      description: 页码
      schema:
        type: integer
        default: 1
      example: 1
    LimitParam:
      name: limit
      in: query
      description: 每页数量
      schema:
        type: integer
        default: 10
      example: 10

  # ===== 通用响应 =====
  responses:
    Unauthorized:
      description: 未认证 / Token 无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            noToken:
              summary: 缺少token
              value:
                code: 401
                message: "请先登录"
                data: null
            invalidToken:
              summary: token无效
              value:
                code: 401
                message: "token已过期，请重新登录"
                data: null
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 404
            message: "资源不存在"
            data: null
    BadRequest:
      description: 参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 400
            message: "参数校验失败"
            data: null

# =============================================================================
# API 路径
# =============================================================================
paths:
  # ========================================================================
  # 1. Front-登录
  # ========================================================================
  /api/front/login/mobile:
    post:
      tags: [Front-登录]
      summary: 手机号验证码登录
      description: |
        C端用户通过手机号和短信验证码登录。
        返回前端 token（UUID 格式），token 以 UUID 格式存储到 Redis。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrontMobileLoginRequest'
            examples:
              validLogin:
                summary: 正向-有效验证码
                value:
                  phone: "13800138000"
                  captcha: "1234"
                  spread: 0
              wrongCaptcha:
                summary: 异常-错误验证码
                value:
                  phone: "13800138000"
                  captcha: "0000"
              emptyPhone:
                summary: 异常-空手机号
                value:
                  phone: ""
                  captcha: "1234"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontLoginResponse'
              examples:
                success:
                  summary: 登录成功
                  value:
                    code: 200
                    message: "登录成功"
                    data:
                      token: "{{FRONT_TOKEN}}"
                      user:
                        uid: 10001
                        nickname: "张三"
                        phone: "13800138000"
                        avatar: "https://img.crmeb.com/avatar/user_10001.jpg"
                        nowMoney: 568.50
                        brokeragePrice: 120.00
                        integral: 3500
                        experience: 1280
                        status: true
                        level: 2
                        spreadUid: 10000
                        isPromoter: true
                        payCount: 15
                        spreadCount: 8
                        loginType: "wechat"
                        createTime: "2025-03-15T14:22:00"
                        lastLoginTime: "2025-06-20T09:15:00"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 验证码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "验证码错误"
                data: null

  /api/front/login:
    post:
      tags: [Front-登录]
      summary: 账号密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrontPasswordLoginRequest'
            examples:
              valid:
                summary: 正向-正确账号密码
                value:
                  account: "13800138000"
                  password: "Pass@123456"
              wrongPassword:
                summary: 异常-密码错误
                value:
                  account: "13800138000"
                  password: "wrongpass"
              notExist:
                summary: 异常-账号不存在
                value:
                  account: "13900000000"
                  password: "Pass@123456"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontLoginResponse'
              example:
                code: 200
                message: "登录成功"
                data:
                  token: "{{FRONT_TOKEN}}"
                  user:
                    uid: 10001
                    nickname: "张三"
                    phone: "13800138000"
                    avatar: "https://img.crmeb.com/avatar/user_10001.jpg"
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/front/sendCode:
    post:
      tags: [Front-登录]
      summary: 发送短信验证码
      description: 向指定手机号发送短信验证码（测试环境验证码固定为1234）
      security: []
      parameters:
        - name: phone
          in: query
          required: true
          description: 手机号
          schema:
            type: string
            pattern: '^1[3-9]\d{9}$'
          example: "13800138000"
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultNoData'
              examples:
                success:
                  summary: 发送成功
                  value:
                    code: 200
                    message: "验证码发送成功"
                limitExceeded:
                  summary: 发送频率限制
                  value:
                    code: 400
                    message: "发送频率过快，请稍后再试"
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/front/logout:
    get:
