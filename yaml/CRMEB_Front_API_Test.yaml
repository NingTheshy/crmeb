          description: 秒杀价
          example: 199.00
        otPrice:
          type: number
          format: decimal
          description: 原价
          example: 499.00
        stock:
          type: integer
          example: 100
        sales:
          type: integer
          example: 850
        timeId:
          type: integer
          description: 秒杀时间段ID
          example: 1
        startTime:
          type: string
          format: date-time
          example: "2025-06-21T10:00:00"
        stopTime:
          type: string
          format: date-time
          example: "2025-06-21T12:00:00"
        status:
          type: integer
