openapi: 3.0.3
info:
  title: CRMEB Front/C端 API 测试文档
  description: |
    CRMEB 多商户 Java 版商城系统 — Front 前端/C端模块 API 接口文档（端口8081）。
    所有前端接口使用 `api/front/*` 路径前缀。

    **认证方式**: 请求头 `Authori-zation` 传入 UUID 格式的 token。
    Front 端 token 以 UUID 格式直接存储到 Redis（不同于 Admin 端的 `TOKEN:ADMIN:` 前缀）。

    **测试数据说明**: 所有示例中的 ID 值均为数据库感知的模拟数据，
    与 `eb_user`、`eb_store_product`、`eb_store_order`、`eb_user_address` 等表结构保持一致。

    **通用响应格式**: `{"code": 200, "message": "success", "data": {...}}`

    **错误码**:
    - 400：请求参数校验失败
    - 401：认证失败 / token 无效或过期
    - 404：资源不存在
  version: 2.0.0
  contact:
    name: CRMEB Team
    email: admin@crmeb.com
    url: https://www.crmeb.com

servers:
  - url: http://localhost:8081
    description: Front 前端/C端服务器

# =============================================================================
# 标签分组
# =============================================================================
tags:
  - name: Front-登录
    description: C端用户登录、注册、登出、token校验
  - name: Front-首页
    description: 首页数据、商品模块、搜索关键词、分享配置
  - name: Front-商品
    description: 商品搜索、详情、评论
  - name: Front-购物车
    description: 购物车增删改查
  - name: Front-订单
    description: 订单创建、列表、详情、取消、收货、评价、退款
  - name: Front-支付
    description: 发起支付、查询支付结果
  - name: Front-用户中心
    description: 用户信息、资料修改
  - name: Front-收货地址
    description: 收货地址增删改查
  - name: Front-提现
    description: 用户余额提现
  - name: Front-推广
    description: 推广佣金数据
  - name: Front-充值
    description: 用户余额充值
  - name: Front-签到
    description: 用户签到与签到记录
  - name: Front-收藏
    description: 商品收藏
  - name: Front-营销-优惠券
    description: 优惠券领取与列表
  - name: Front-营销-砍价
    description: 砍价商品浏览与参与
  - name: Front-营销-拼团
    description: 拼团商品浏览
  - name: Front-营销-秒杀
    description: 秒杀商品浏览
  - name: Front-文章
    description: 文章/帮助中心
  - name: Front-门店
    description: 自提门店列表
  - name: Front-城市
    description: 城市数据
  - name: Front-用户优惠券
    description: 用户已领取的优惠券

# =============================================================================
# 安全定义
# =============================================================================
security:
  - FrontToken: []

# =============================================================================
# 组件定义
# =============================================================================
components:
  securitySchemes:
    FrontToken:
      type: apiKey
      in: header
      name: Authori-zation
      description: Front 前端/C端认证 token（UUID 格式）

  schemas:
    # ===== 通用响应包装 =====
    CommonResult:
      type: object
      properties:
        code:
          type: integer
          description: 响应码，200=成功
          example: 200
        message:
          type: string
          description: 响应消息
          example: "success"
        data:
          description: 响应数据

    CommonResultNoData:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "success"

    PageInfo:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 156
        list:
          type: array
          items:
            type: object

    # ===== 用户实体 (eb_user) =====
    User:
      type: object
      properties:
        uid:
          type: integer
          description: 用户ID
          example: 10001
        nickname:
          type: string
          description: 用户昵称
          example: "张三"
        avatar:
          type: string
          description: 头像URL
          example: "https://img.crmeb.com/avatar/user_10001.jpg"
        phone:
          type: string
          description: 手机号
          example: "13800138000"
        sex:
          type: integer
          description: 性别 0未知/1男/2女
          example: 1
        birthday:
          type: string
          description: 生日
          example: "1995-08-15"
        nowMoney:
          type: number
          format: decimal
          description: 用户余额
          example: 568.50
        brokeragePrice:
          type: number
          format: decimal
          description: 佣金金额
          example: 120.00
        integral:
          type: integer
          description: 积分
          example: 3500
        experience:
          type: integer
          description: 经验值
          example: 1280
        status:
          type: boolean
          description: 状态 true正常/false禁止
          example: true
        level:
          type: integer
          description: 会员等级
          example: 2
        spreadUid:
          type: integer
          description: 推广人ID
          example: 10000
        isPromoter:
          type: boolean
          description: 是否为推广员
          example: true
        payCount:
          type: integer
          description: 购买次数
          example: 15
        spreadCount:
          type: integer
          description: 下级人数
          example: 8
        loginType:
          type: string
          description: 登录类型 h5/wechat/routine
          example: "wechat"
        addres:
          type: string
          description: 默认地址
          example: "广东省深圳市南山区"
        createTime:
          type: string
          format: date-time
          example: "2025-03-15T14:22:00"
        lastLoginTime:
          type: string
          format: date-time
          example: "2025-06-20T09:15:00"

    # ===== 商品实体 (eb_store_product) =====
    StoreProduct:
      type: object
      properties:
        id:
          type: integer
          example: 5001
        image:
          type: string
          description: 商品主图
          example: "https://img.crmeb.com/product/sku_5001_main.jpg"
        sliderImage:
          type: array
          items:
            type: string
          description: 轮播图
          example:
            - "https://img.crmeb.com/product/sku_5001_1.jpg"
            - "https://img.crmeb.com/product/sku_5001_2.jpg"
            - "https://img.crmeb.com/product/sku_5001_3.jpg"
        storeName:
          type: string
          description: 商品名称
          example: "2025新款潮流T恤 纯棉短袖"
        storeInfo:
          type: string
          description: 商品简介
          example: "优质纯棉面料，透气舒适，百搭款式，多色可选"
        keyword:
          type: string
          description: 搜索关键词
          example: "T恤,短袖,纯棉,潮流"
        cateId:
          type: string
          description: 分类ID(逗号分隔)
          example: "10,101"
        price:
          type: number
          format: decimal
          description: 商品售价
          example: 129.00
        otPrice:
          type: number
          format: decimal
          description: 市场价
          example: 299.00
        cost:
          type: number
          format: decimal
          description: 成本价
          example: 65.00
        postage:
          type: number
          format: decimal
          description: 邮费
          example: 0.00
        unitName:
          type: string
          description: 单位
          example: "件"
        stock:
          type: integer
          description: 库存
          example: 500
        sales:
          type: integer
          description: 销量
          example: 2365
        isShow:
          type: boolean
          description: 是否上架
          example: true
        isHot:
          type: boolean
          description: 是否热卖
          example: true
        isNew:
          type: boolean
          description: 是否新品
          example: false
        isGood:
          type: boolean
          description: 是否优品推荐
          example: true
        specType:
          type: boolean
          description: 规格类型 false单规格/true多规格
          example: true
        giveIntegral:
          type: integer
          description: 赠送积分
          example: 10
        ficti:
          type: integer
          description: 虚拟销量
          example: 120
        browse:
          type: integer
          description: 浏览量
          example: 8900

    StoreProductSimple:
      type: object
      properties:
        id:
          type: integer
          example: 5002
        image:
          type: string
          example: "https://img.crmeb.com/product/sku_5002_main.jpg"
        storeName:
          type: string
          example: "夏季冰丝防晒衣 UPF50+"
        price:
          type: number
          format: decimal
          example: 89.00
        otPrice:
          type: number
          format: decimal
          example: 199.00
        sales:
          type: integer
          example: 1520
        isHot:
          type: boolean
          example: false
        isNew:
          type: boolean
          example: true

    # ===== 购物车实体 (eb_store_cart) =====
    StoreCart:
      type: object
      properties:
        id:
          type: integer
          example: 8001
        uid:
          type: integer
          example: 10001
        productId:
          type: integer
          example: 5001
        productAttrUnique:
          type: string
          description: 商品属性唯一值
          example: "abc123def456"
        cartNum:
          type: integer
          description: 数量
          example: 2
        productInfo:
          $ref: '#/components/schemas/StoreProductSimple'

    CartSaveRequest:
      type: object
      required:
        - productId
        - productAttrUnique
        - cartNum
        - isNew
      properties:
        productId:
          type: integer
          description: 商品ID
          example: 5001
        productAttrUnique:
          type: string
          description: 商品属性唯一值
          example: "abc123def456"
        cartNum:
          type: integer
          description: 加入数量
          minimum: 1
          example: 2
        isNew:
          type: boolean
          description: 是否新商品
          example: true

    CartDeleteRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          description: 购物车ID列表
          items:
            type: integer
          example: [8001, 8002]

    CartNumRequest:
      type: object
      required:
        - id
        - number
      properties:
        id:
          type: integer
          description: 购物车项ID
          example: 8001
        number:
          type: integer
          description: 修改后数量
          minimum: 1
          example: 3

    CartCountResponse:
      type: object
      properties:
        count:
          type: integer
          description: 购物车商品总数
          example: 5

    # ===== 订单实体 (eb_store_order) =====
    StoreOrder:
      type: object
      properties:
        id:
          type: integer
          example: 88001
        orderId:
          type: string
          description: 订单号
          example: "20250620100000088001"
        uid:
          type: integer
          example: 10001
        realName:
          type: string
          example: "张三"
        userPhone:
          type: string
          example: "13800138000"
        userAddress:
          type: string
          description: 收货地址
          example: "广东省深圳市南山区科技园路100号创新大厦A座501"
        totalNum:
          type: integer
          description: 商品总数
          example: 2
        totalPrice:
          type: number
          format: decimal
          description: 订单总价
          example: 258.00
        totalPostage:
          type: number
          format: decimal
          description: 邮费
          example: 0.00
        payPrice:
          type: number
          format: decimal
          description: 实付金额
          example: 238.00
        payPostage:
          type: number
          format: decimal
          example: 0.00
        couponId:
          type: integer
          example: 501
        couponPrice:
          type: number
          format: decimal
          description: 优惠券抵扣金额
          example: 20.00
        useIntegral:
          type: integer
          description: 使用积分
          example: 200
        integralPrice:
          type: number
          format: decimal
          description: 积分抵扣金额
          example: 2.00
        mark:
          type: string
          description: 订单备注
          example: "请发顺丰快递"
        paid:
          type: boolean
          description: 是否已支付
          example: true
        payTime:
          type: string
          format: date-time
          example: "2025-06-20T10:05:30"
        payType:
          type: string
          description: 支付方式 weixin/alipay
          example: "weixin"
        status:
          type: integer
          description: 订单状态 0未付/1待发货/2待收货/3待评价/4已完成/-3已退款
          example: 1
        refundStatus:
          type: integer
          description: 退款状态 0未退款/1退款中/2已退款
          example: 0
        deliveryType:
          type: string
          description: 发货类型 express=快递/send=自提
          example: "express"
        deliveryName:
          type: string
          example: "顺丰速运"
        deliveryId:
          type: string
          example: "SF1234567890"
        createTime:
          type: string
          format: date-time
          example: "2025-06-20T10:00:00"
        productList:
          type: array
          items:
            $ref: '#/components/schemas/StoreOrderProduct'

    StoreOrderProduct:
      type: object
      properties:
        productId:
          type: integer
          example: 5001
        productName:
          type: string
          example: "2025新款潮流T恤 纯棉短袖"
        image:
          type: string
          example: "https://img.crmeb.com/product/sku_5001_main.jpg"
        productAttrUnique:
          type: string
          example: "abc123def456"
        sku:
          type: string
          description: 商品规格
          example: "白色 L码"
        price:
          type: number
          format: decimal
          example: 129.00
        cartNum:
          type: integer
          example: 2

    StoreOrderSimple:
      type: object
      properties:
        id:
          type: integer
          example: 88001
        orderId:
          type: string
          example: "20250620100000088001"
        payPrice:
          type: number
          format: decimal
          example: 238.00
        totalNum:
          type: integer
          example: 2
        paid:
          type: boolean
          example: true
        status:
          type: integer
          example: 1
        createTime:
          type: string
          format: date-time
          example: "2025-06-20T10:00:00"
        cartInfo:
          type: array
          items:
            $ref: '#/components/schemas/StoreOrderProduct'

    OrderCreateRequest:
      type: object
      required:
        - cartIdList
        - addressId
        - payType
        - from
      properties:
        cartIdList:
          type: array
          description: 购物车ID列表
          items:
            type: integer
          example: [8001, 8002]
        addressId:
          type: integer
          description: 收货地址ID
          example: 2001
        couponId:
          type: integer
          description: 优惠券ID(可选)
          example: 501
        useIntegral:
          type: integer
          description: 使用积分(可选)
          example: 200
        mark:
          type: string
          description: 订单备注(可选)
          example: "请发顺丰快递"
        preOrderNo:
          type: string
          description: 预下单订单号(可选)
          example: ""
        payType:
          type: string
          description: 支付方式
          enum: [weixin, alipay, yue]
          example: "weixin"
        from:
          type: string
          description: 订单来源
          enum: [routine, wechat, h5, pc]
          example: "wechat"

    OrderCancelRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          description: 订单ID
          example: 88001

    OrderTakeRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          description: 订单ID
          example: 88001

    OrderCommentRequest:
      type: object
      required:
        - productId
        - orderNo
        - score
        - comment
      properties:
        productId:
          type: integer
          description: 商品ID
          example: 5001
        orderNo:
          type: string
          description: 订单号
          example: "20250620100000088001"
        score:
          type: integer
          description: 评分 1-5
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          description: 评价内容
          example: "质量非常好，穿着很舒服，值得购买！"
        pics:
          type: array
          description: 评价图片
          items:
            type: string
          example:
            - "https://img.crmeb.com/comment/img_88001_1.jpg"
            - "https://img.crmeb.com/comment/img_88001_2.jpg"

    OrderRefundRequest:
      type: object
      required:
        - orderNo
        - text
      properties:
        orderNo:
          type: string
          description: 订单号
          example: "20250620100000088001"
        text:
          type: string
          description: 退款原因
          example: "商品与描述不符，申请退款"
        refundPrice:
          type: number
          format: decimal
          description: 退款金额(可选，不填默认全额)
          example: 238.00
        pics:
          type: array
          description: 凭证图片
          items:
            type: string
          example:
            - "https://img.crmeb.com/refund/img_88001_1.jpg"

    # ===== 收货地址实体 (eb_user_address) =====
    UserAddress:
      type: object
      properties:
        id:
          type: integer
          example: 2001
        uid:
          type: integer
          example: 10001
        realName:
          type: string
          description: 收货人姓名
          example: "张三"
        phone:
          type: string
          description: 手机号
          example: "13800138000"
        province:
          type: string
          description: 省份
          example: "广东省"
        city:
          type: string
          description: 城市
          example: "深圳市"
        district:
          type: string
          description: 区/县
          example: "南山区"
        detail:
          type: string
          description: 详细地址
          example: "科技园路100号创新大厦A座501"
        postCode:
          type: integer
          description: 邮政编码
          example: 518000
        isDefault:
          type: boolean
          description: 是否默认
          example: true

    UserAddressEditRequest:
      type: object
      required:
        - realName
        - phone
        - province
        - city
        - district
        - detail
      properties:
        id:
          type: integer
          description: 地址ID(修改时传入，新增时不传)
          example: 2001
        realName:
          type: string
          description: 收货人姓名
          example: "张三"
        phone:
          type: string
          description: 手机号
          example: "13800138000"
        province:
          type: string
          description: 省份
          example: "广东省"
        city:
          type: string
          description: 城市
          example: "深圳市"
        district:
          type: string
          description: 区/县
          example: "南山区"
        detail:
          type: string
          description: 详细地址
          example: "科技园路100号创新大厦A座501"
        postCode:
          type: integer
          description: 邮政编码(可选)
          example: 518000
        isDefault:
          type: boolean
          description: 是否设为默认(可选)
          example: true

    # ===== 提现实体 =====
    ExtractCashRequest:
      type: object
      required:
        - extractType
        - extractPrice
      properties:
        extractType:
          type: string
          description: 提现方式
          enum: [bank, weixin, alipay]
          example: "weixin"
        extractPrice:
          type: number
          format: decimal
          description: 提现金额
          minimum: 1
          example: 100.00
        name:
          type: string
          description: 收款人姓名
          example: "张三"
        wechat:
          type: string
          description: 微信号(微信提现时必填)
          example: "zhangsan_wx"

    ExtractRecord:
      type: object
      properties:
        id:
          type: integer
          example: 3001
        uid:
          type: integer
          example: 10001
        extractType:
          type: string
          example: "weixin"
        extractPrice:
          type: number
          format: decimal
          example: 100.00
        balance:
          type: number
          format: decimal
          example: 468.50
        status:
          type: integer
          description: 0审核中/1已通过/-1已拒绝
          example: 0
        failMsg:
          type: string
          example: ""
        createTime:
          type: string
          format: date-time
          example: "2025-06-18T16:30:00"

    # ===== 佣金实体 =====
    CommissionData:
      type: object
      properties:
        brokeragePrice:
          type: number
          format: decimal
          description: 可提现佣金
          example: 120.00
        totalBrokeragePrice:
          type: number
          format: decimal
          description: 累计佣金
          example: 580.00
        spreadCount:
          type: integer
          description: 推广人数
          example: 8
        spreadOrderCount:
          type: integer
          description: 推广订单数
          example: 23
        yesterdayPrice:
          type: number
          format: decimal
          description: 昨日佣金
          example: 15.50

    # ===== 充值实体 =====
    RechargePackage:
      type: object
      properties:
        id:
          type: integer
          example: 101
        price:
          type: number
          format: decimal
          description: 充值金额
          example: 100.00
        givePrice:
          type: number
          format: decimal
          description: 赠送金额
          example: 10.00
        isRecommend:
          type: boolean
          example: true

    RechargeRequest:
      type: object
      required:
        - rechargeId
        - payType
        - from
      properties:
        rechargeId:
          type: integer
          description: 充值套餐ID
          example: 101
        payType:
          type: string
          enum: [weixin, alipay]
          example: "weixin"
        from:
          type: string
          example: "wechat"

    # ===== 签到实体 (eb_user_sign) =====
    UserSignRecord:
      type: object
      properties:
        id:
          type: integer
          example: 601
        uid:
          type: integer
          example: 10001
        title:
          type: string
