# CRMEB 相关配置
crmeb:
  version: CRMEB-JAVA-KY-v1.4 # 当前代码版本
  imagePath: /JAVA_PROJECT/OPEN/dev/admin/ # 服务器图片路径配置 斜杠结尾
  asyncConfig: false #是否同步config表数据到redis
  # 短信Mock模式配置
  smsMockEnable: true # true=启用Mock绕过一号通（测试环境），false=关闭使用真实一号通
  smsMockFixedCode: "" # Mock模式固定验证码，为空则随机生成（6位数字）

server:
  port: 9081

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/single_open?characterEncoding=utf-8&useSSL=false&serverTimezone=GMT+8&allowPublicKeyRetrieval=true
    username: single_open
    password: root
  redis:
    host: 127.0.0.1 #地址
    port: 6379 #端口
    password: root
    timeout: 10000 # 连接超时时间（毫秒）
    database: 6 #默认数据库
    jedis:
      pool:
        max-active: 200 # 连接池最大连接数（使用负值表示没有限制）
        max-wait: -1 # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-idle: 10 # 连接池中的最大空闲连接
        min-idle: 0 # 连接池中的最小空闲连接
        time-between-eviction-runs: -1 #逐出扫描的时间间隔(毫秒) 如果为负数,则不运行逐出线程, 默认-1
